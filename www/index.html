<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seu Assistente</title>
<meta name="description" content="Tarefas, diário e modo foco com lembretes e sincronização na nuvem.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7B4DFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Assistente">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho fixo com progresso do dia, conteúdo em coluna única, barra de navegação inferior (Listas · Diário · Foco). */
:root{
  --bg:#F6F3FF; --surface:#FFFFFF; --fg:#17122B; --muted:#625C80; --line:#E2DCF5;
  --accent:#5B3DF5; --accent-fg:#FFFFFF; --accent-soft:#ECE7FF;
  --g1:#7B4DFF; --g2:#E8479A; --g3:#FF8A3D;
  --grad:linear-gradient(135deg,#7B4DFF 0%,#E8479A 55%,#FF8A3D 100%);
  --hi:#D4143F; --hi-soft:#FFE3EA; --mid:#B85A00; --mid-soft:#FFEBCF; --lo:#0A6FD8; --lo-soft:#DDEEFF;
  --shadow:0 1px 2px rgba(60,30,140,.10),0 8px 24px rgba(60,30,140,.10);
  --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,sans-serif;
  font-size:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110D1F; --surface:#1C1633; --fg:#EEEAFB; --muted:#A59FC4; --line:#32295A;
  --accent:#A99BFF; --accent-fg:#120A3D; --accent-soft:#2A1F5C;
  --g1:#8B5CFF; --g2:#F0489E; --g3:#FF9548;
  --grad:linear-gradient(135deg,#7B4DFF 0%,#E8479A 55%,#FF8A3D 100%);
  --hi:#FF6B8B; --hi-soft:#43152A; --mid:#FFB347; --mid-soft:#40290C; --lo:#5CB8FF; --lo-soft:#10304F;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110D1F; --surface:#1C1633; --fg:#EEEAFB; --muted:#A59FC4; --line:#32295A;
  --accent:#A99BFF; --accent-fg:#120A3D; --accent-soft:#2A1F5C;
  --g1:#8B5CFF; --g2:#F0489E; --g3:#FF9548;
  --grad:linear-gradient(135deg,#7B4DFF 0%,#E8479A 55%,#FF8A3D 100%);
  --hi:#FF6B8B; --hi-soft:#43152A; --mid:#FFB347; --mid-soft:#40290C; --lo:#5CB8FF; --lo-soft:#10304F;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark}
:root.big{font-size:19px}
:root.hc{--muted:var(--fg);--line:var(--fg)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 112px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.hrow{display:flex;align-items:center;gap:12px}
.hrow .t{flex:1;min-width:0}
.hello{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.1}
.date{color:var(--muted);font-size:.85rem}.date::first-letter{text-transform:uppercase}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.prog{margin-top:12px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.prog .lbl{font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.lvl{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.hi{background:var(--hi-soft);color:var(--hi)}.pill.mid{background:var(--mid-soft);color:var(--mid)}.pill.lo{background:var(--lo-soft);color:var(--lo)}
.pill.plain{background:var(--line);color:var(--muted)}

/* composer */
.composer{display:flex;gap:8px;margin-top:16px}
.composer input{flex:1;min-width:0;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.composer .iconbtn{width:50px;height:50px;border-radius:14px}
.composer .go{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.composer .rec{background:var(--hi);color:#fff;border-color:var(--hi)}
.hint{font-size:.8rem;color:var(--muted);margin:6px 2px 0}

/* lists */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:500;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sect{margin-top:20px}
.sect h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sect h2 .dot{width:10px;height:10px;border-radius:50%}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;display:grid;place-items:center;margin-top:1px}
.chk svg{width:16px;height:16px;opacity:0}
.task.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.task.done .chk svg{opacity:1}
.p-hi .chk{border-color:var(--hi)}.p-mid .chk{border-color:var(--mid)}.p-lo .chk{border-color:var(--lo)}
.tbody{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.ttl{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;font-size:.8rem;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:14px;height:14px}
.meta .over{color:var(--hi);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:28px 8px}

/* diary */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:12px;resize:vertical}
.moods{display:flex;gap:6px;margin-block:10px}
.mood{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem}
.mood[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.entry .when{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.entry p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.btn{height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--hi);border-color:var(--hi)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* focus */
.focus-pick .task{cursor:pointer}
.bigtime{font-family:var(--f-display);font-size:3.2rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:8px 0}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:16px;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));text-align:center}
.lock h2{font-size:1.6rem}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;inset:0 auto 0 0;width:0;background:var(--hi-soft)}
.hold span{position:relative}

/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.bottom .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;color:var(--muted);font-size:.78rem;font-weight:600;min-height:54px}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,16,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:1.25rem;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld>label,.fld>.l{font-size:.82rem;font-weight:600;color:var(--muted)}
.fld input[type=text],.fld input[type=datetime-local],.fld input[type=number],.fld select,.fld textarea{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}
.fld textarea{height:auto;min-height:80px;padding:10px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;gap:10px;min-height:44px}
.sw input{width:22px;height:22px;accent-color:var(--accent)}

/* toasts / alerts */
#alerts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:90;display:flex;flex-direction:column;gap:8px;padding-inline:max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.alert{pointer-events:auto;max-width:640px;margin:0 auto;width:100%;background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.alert b{display:block}
.alert .row{margin-top:8px}
.alert button{height:38px;border-radius:10px;border:1px solid currentColor;background:transparent;padding:0 12px;font-weight:600}
.toast{pointer-events:none;max-width:640px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:.9rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:.82rem;background:var(--surface)}
.badge.off{opacity:.45}
.badge b{display:block;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.rm *{transition:none!important;animation:none!important}
[hidden]{display:none!important}

/* ---- paleta vibrante com degradê ---- */
body::before{background:var(--g1)}
header.top{background:var(--grad);color:#fff;border-bottom:0;border-radius:0 0 24px 24px;padding-bottom:16px;box-shadow:0 10px 28px -12px rgba(123,77,255,.7)}
header.top .date,header.top .prog .lbl{color:rgba(255,255,255,.9)}
header.top .bar{background:rgba(255,255,255,.3)}
header.top .bar>i{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8)}
header.top .pill{background:rgba(255,255,255,.22);color:#fff}
header.top .iconbtn{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);color:#fff}
.composer .go,.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px -6px rgba(232,71,154,.7)}
.chip[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}
.task.done .chk{background:var(--grad);border-color:transparent;color:#fff}
.badge:not(.off){border:1.5px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box}
.pill{background:var(--accent-soft);color:var(--accent)}
.pill.hi{background:var(--hi-soft);color:var(--hi)}.pill.mid{background:var(--mid-soft);color:var(--mid)}.pill.lo{background:var(--lo-soft);color:var(--lo)}.pill.plain{background:var(--line);color:var(--muted)}
header.top .pill.hi,header.top .pill.mid,header.top .pill.lo,header.top .pill.plain{background:rgba(255,255,255,.22);color:#fff}
.lock{background:var(--grad);color:#fff}
.lock p,.lock #fx{color:rgba(255,255,255,.92)!important}
.lock .pill{background:rgba(255,255,255,.24);color:#fff}
.lock .btn.pri{background:#fff;color:#4A2BD0;box-shadow:0 10px 24px -8px rgba(0,0,0,.35)}
.lock .btn.danger{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.55)}
.lock .hold i{background:rgba(255,255,255,.35)}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 6px;text-align:center;font-size:.72rem;color:var(--muted);font-weight:600}
.day b{display:block;font-size:1.05rem;color:var(--fg);font-variant-numeric:tabular-nums}
.day i{display:block;height:6px;margin-top:3px}.day i::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent)}.day i.none::after{background:transparent}
.day[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}.day[aria-pressed="true"] b{color:#fff}.day[aria-pressed="true"] i::after{background:#fff}
.sub{display:flex;gap:10px;align-items:center;min-height:42px;border-bottom:1px solid var(--line)}
input[type=time]{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}

.task .play{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--accent);text-decoration:none}
.task .play svg{width:18px;height:18px}
.task .play.on{background:var(--grad);color:#fff;border-color:transparent}
.task.proj{opacity:.78}.task.proj .chk{border-style:dashed}
.pill.doing{background:var(--accent-soft);color:var(--accent)}
.pill .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pl 1.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.tprog{position:relative;height:8px;border-radius:99px;background:var(--line);margin-top:10px;overflow:visible}
.tprog i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .4s}
.tprog b{position:absolute;right:0;top:-18px;font-size:.7rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.tbody{padding-top:2px}
input[type=range]{accent-color:var(--accent);height:34px}
.alert span{display:block}
.alert a.btnlink{height:38px;border-radius:10px;border:1px solid currentColor;background:transparent;padding:0 12px;font-weight:600;display:inline-grid;place-items:center;color:inherit;text-decoration:none}

.hero{margin-top:16px;border:1.5px solid transparent;border-radius:18px;padding:16px;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;box-shadow:var(--shadow)}
.hk{display:flex;gap:8px;flex-wrap:wrap}
.ht{font-size:1.35rem;margin:10px 0 6px;overflow-wrap:anywhere}
.hbtns{margin-top:16px}.hbtns .btn{height:42px;padding:0 14px;flex:1 1 auto}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 4px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.tile b{font-family:var(--f-display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:.7rem;color:var(--muted);font-weight:600;line-height:1.2}
.tile.hi b{color:var(--hi)}
.meter{display:grid;grid-template-columns:1fr auto;gap:6px 8px;margin-top:12px;font-size:.85rem}.meter:first-child{margin-top:0}.meter span{color:var(--muted)}.meter b{font-variant-numeric:tabular-nums}
.mbar{grid-column:1/-1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}.mbar i{display:block;height:100%;background:var(--grad);border-radius:99px;min-width:4px}
.mini{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.mtxt{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:flex;flex-direction:column;gap:2px}
.mini .meta{margin:0}
.nd{padding:2px 14px}
.ndrow{display:flex;gap:14px;align-items:center;padding:10px 0;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line)}
.ndrow:last-child{border-bottom:0}
.ndd{width:44px;text-align:center;font-size:.72rem;color:var(--muted);font-weight:600;flex:none}.ndd b{display:block;font-size:1.25rem;color:var(--fg);font-variant-numeric:tabular-nums}
.ndl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:.88rem}.ndl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ndl .muted{color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;height:116px}
.bars>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-weight:600;min-height:0}
.bars u{flex:1;width:100%;display:flex;align-items:flex-end;text-decoration:none;min-height:0}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--grad)}.bars i.z{background:var(--line)}
.bars b{font-size:.8rem;color:var(--fg);height:1em;line-height:1}
nav.bottom .in{grid-template-columns:repeat(4,1fr)!important}

.foot{margin:28px 0 8px;text-align:center;font-size:.78rem;color:var(--muted)}
.foot a{color:var(--accent);font-weight:600;text-decoration:none}
.btn.link{display:inline-grid;place-items:center;text-decoration:none;color:var(--fg)}
/* ---------- tela de entrada ---------- */
#gate{z-index:200;overflow:auto;justify-content:flex-start;padding-top:max(48px,env(safe-area-inset-top,0px))}
#gate>*{margin-inline:auto;width:100%;max-width:380px}
#gate .logo{width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:2rem}
#gate .fine{font-size:.82rem;opacity:.9;margin:0}
#gate .stack{display:flex;flex-direction:column;gap:10px}
.lock .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.55)}
.lock .btn:disabled{opacity:.55}
.dots{display:flex;gap:12px;justify-content:center;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.8)}
.dots i.on{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad .key{height:58px;border-radius:16px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.16);color:#fff;font-size:1.4rem;font-weight:700}
.pad .key.sm{font-size:1rem}
.pad .key:active{background:rgba(255,255,255,.36)}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#gate.bad .dots{animation:shk .35s}
@media (prefers-reduced-motion:reduce){#gate.bad .dots{animation:none}}
</style>
</head>
<body>

<div id="alerts" aria-live="assertive"></div>
<div class="wrap">
  <header class="top">
    <div class="hrow">
      <div class="t"><div class="hello" id="hello">Olá</div><div class="date" id="date"></div></div>
      <button class="iconbtn" id="btnSet" aria-label="Ajustes"></button>
    </div>
    <div class="prog" role="group" aria-label="Progresso do dia">
      <div class="bar" role="progressbar" id="pbar" aria-valuemin="0" aria-valuemax="100"><i id="pfill"></i></div>
      <div class="lbl" id="plbl"></div>
    </div>
    <div class="lvl" id="lvl"></div>
  </header>

  <div id="composerBox" class="composer-box">
    <form class="composer" id="quickForm" autocomplete="off">
      <label class="sr" for="quick">Nova tarefa</label>
      <input id="quick" type="text" placeholder="Ex.: Pagar boleto amanhã às 15h, urgente">
      <button type="button" class="iconbtn" id="btnMic" aria-label="Ditar por voz"></button>
      <button type="submit" class="iconbtn go" aria-label="Adicionar tarefa"></button>
    </form>
    <p class="hint">Data, hora, repetição e prioridade são reconhecidas do texto.</p>
  </div>

  <main id="view" aria-live="polite"></main>
  <footer class="foot">Seu Assistente · desenvolvido por <a href="https://github.com/Rafajames" target="_blank" rel="noopener">Jamerson Rafael</a></footer>
</div>

<nav class="bottom" aria-label="Principal"><div class="in">
  <button data-tab="home"></button><button data-tab="lists"></button><button data-tab="diary"></button><button data-tab="focus"></button>
</div></nav>
<div id="overlay"></div>

<script>
"use strict";
/* ---------- util ---------- */
const CAP=window.Capacitor||null;
const isNative=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
const plug=n=>isNative&&CAP.Plugins?CAP.Plugins[n]:null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toLocalInput=d=>`${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const sameDay=(a,b)=>ymd(a)===ymd(b);
const DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const DIAS3=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const I={
 list:'<path d="M8 6h12M8 12h12M8 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
 book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5zM4 5.5V21.5M8 7h8"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
 check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 repeat:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>',
 bell:'<path d="M6 9a6 6 0 1 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/>',
 pin:'<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
 home:'<path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 play:'<path d="M7 4.5v15l12-7.5z"/>',
 pause:'<path d="M8 5v14M16 5v14"/>',
 share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
 clip:'<path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/>'
};
const ic=(n,extra="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${I[n]}</svg>`;

/* ---------- estado ---------- */
const KEY="assistente:v1";
let S=load();
function blank(){return{tasks:[],diary:[],xp:0,streak:0,lastDone:null,focusDone:0,
  settings:{theme:"auto",big:false,hc:false,calm:false,nagMin:30,quiet:{on:false,from:"22:00",to:"07:00"},summary:true,summaryAt:"08:00",weekly:false,shareOn:true,dailyGoal:3,name:""},updatedAt:0,examples:false}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);const o=Object.assign(blank(),s,{settings:Object.assign(blank().settings,s.settings||{})});o.tasks.forEach(t=>{delete t.att;t.tags=t.tags||[];t.subs=t.subs||[]});return o}}catch(e){}
  return seed()}
function seed(){
  const s=blank(),now=new Date(),mk=(title,h,m,extra={})=>{const d=new Date(now);d.setHours(h,m,0,0);return Object.assign({id:uid(),title,notes:"",due:toLocalInput(d),prio:"auto",rep:{unit:"none",every:1,days:[]},rem:[0,10],fired:[],nag:true,place:"",lat:null,lng:null,rad:150,locFired:false,tags:[],subs:[],done:false,doneAt:null,created:Date.now(),example:true},extra)};
  const t1=mk("Revisar relatório e enviar (exemplo)",now.getHours()+2>23?23:now.getHours()+2,0);
  const t2=mk("Tomar vitamina (exemplo)",8,0,{rep:{unit:"day",every:1,days:[]},rem:[0]});
  const t3=mk("Comprar café na padaria (exemplo)",18,0,{place:"Padaria do bairro",rem:[0]});
  t3.due="";
  s.tasks=[t1,t2,t3];s.examples=true;
  s.diary=[{id:uid(),at:Date.now(),mood:3,text:"Exemplo: hoje quero terminar o relatório antes do almoço e caminhar à tarde.",example:true}];
  return s}
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Armazenamento cheio. Apague tarefas concluídas antigas.")}
  clearTimeout(cloud.timer);if(tk())cloud.timer=setTimeout(push,1500);schedNative();}
function slim(){return JSON.parse(JSON.stringify(S))}
function adopt(remote){
  S=Object.assign(blank(),remote,{settings:Object.assign(blank().settings,remote.settings||{})});
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  applyPrefs();render();}

/* ---------- nuvem: login e armazenamento escolhidos pelo usuário ---------- */
/* Preencha os identificadores abaixo (veja o README). Deixe "" para ocultar o provedor. */
const CFG={google:{clientId:"471618031590-ei8rt2a7s3do3901f5kg0iblpig1uvcc.apps.googleusercontent.com"},dropbox:{appKey:""},microsoft:{clientId:""}};
const PROV={google:"Google Drive",dropbox:"Dropbox",microsoft:"OneDrive"};
const REDIR=location.origin+location.pathname;
const FILE="assistente.json";
const MS_SCOPE="Files.ReadWrite.AppFolder offline_access User.Read";
const MS_TOKEN="https://login.microsoftonline.com/common/oauth2/v2.0/token";
const DBX_TOKEN="https://api.dropboxapi.com/oauth2/token";
const cloud={state:"local",timer:null};
const tk=()=>{try{return JSON.parse(localStorage.getItem(KEY+":auth"))||null}catch(e){return null}};
const setTk=a=>{try{a?localStorage.setItem(KEY+":auth",JSON.stringify(a)):localStorage.removeItem(KEY+":auth")}catch(e){}};
const cfgOf=p=>p==="google"?CFG.google.clientId:p==="dropbox"?CFG.dropbox.appKey:CFG.microsoft.clientId;
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function pkce(){const v=b64u(crypto.getRandomValues(new Uint8Array(48)));const c=b64u(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));return{v,c}}
async function startPkce(p){
  const {v,c}=await pkce(),st=uid();localStorage.setItem("assistente:pk",JSON.stringify({p,v,st}));
  const ru=encodeURIComponent(REDIR);
  location.href=p==="dropbox"
   ?`https://www.dropbox.com/oauth2/authorize?client_id=${CFG.dropbox.appKey}&response_type=code&code_challenge=${c}&code_challenge_method=S256&token_access_type=offline&redirect_uri=${ru}&state=${st}`
   :`https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id=${CFG.microsoft.clientId}&response_type=code&redirect_uri=${ru}&response_mode=query&scope=${encodeURIComponent(MS_SCOPE)}&code_challenge=${c}&code_challenge_method=S256&state=${st}`}
async function handleRedirect(){
  const q=new URLSearchParams(location.search),code=q.get("code");if(!code)return;
  let pk=null;try{pk=JSON.parse(localStorage.getItem("assistente:pk"))}catch(e){}
  history.replaceState(null,"",location.pathname);localStorage.removeItem("assistente:pk");
  if(!pk||pk.st!==q.get("state")){toast("Login inválido. Tente de novo.");return}
  try{
    const body=new URLSearchParams({code,grant_type:"authorization_code",redirect_uri:REDIR,code_verifier:pk.v});
    let url;
    if(pk.p==="dropbox"){body.set("client_id",CFG.dropbox.appKey);url=DBX_TOKEN}
    else{body.set("client_id",CFG.microsoft.clientId);body.set("scope",MS_SCOPE);url=MS_TOKEN}
    const r=await fetch(url,{method:"POST",body}),j=await r.json();if(!r.ok)throw j;
    setTk({p:pk.p,access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000});
    await afterLogin()
  }catch(e){toast("Falha no login. Confira o Client ID e o endereço de retorno.")}}
function loadGsi(){return new Promise((res,rej)=>{if(window.google&&google.accounts)return res();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function googleToken(silent){
  await loadGsi();
  return new Promise((res,rej)=>{
    const c=google.accounts.oauth2.initTokenClient({client_id:CFG.google.clientId,
      scope:"https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email",
      callback:r=>{if(r.error)return rej(r);const a=tk()||{};a.p="google";a.access=r.access_token;a.exp=Date.now()+(r.expires_in-60)*1000;setTk(a);res(a)},
      error_callback:rej});
    c.requestAccessToken({prompt:silent?"":"select_account"})})}
async function token(){
  const a=tk();if(!a)throw{error:"sem_login"};
  if(Date.now()<a.exp)return a.access;
  if(a.p==="google"){await googleToken(true);return tk().access}
  const body=new URLSearchParams({grant_type:"refresh_token",refresh_token:a.refresh,client_id:cfgOf(a.p)});
  if(a.p==="microsoft")body.set("scope",MS_SCOPE);
  const r=await fetch(a.p==="dropbox"?DBX_TOKEN:MS_TOKEN,{method:"POST",body}),j=await r.json();
  if(!r.ok){throw{error:"sessao_expirada"}}
  a.access=j.access_token;if(j.refresh_token)a.refresh=j.refresh_token;a.exp=Date.now()+(j.expires_in-60)*1000;setTk(a);return a.access}
async function whoami(a){
  try{
    const H={Authorization:"Bearer "+a.access};
    if(a.p==="google")return(await(await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:H})).json()).email;
    if(a.p==="dropbox")return(await(await fetch("https://api.dropboxapi.com/2/users/get_current_account",{method:"POST",headers:H})).json()).email;
    const j=await(await fetch("https://graph.microsoft.com/v1.0/me",{headers:H})).json();return j.mail||j.userPrincipalName
  }catch(e){return""}}
async function remoteRead(){
  const t=await token(),a=tk(),H={Authorization:"Bearer "+t};
  if(a.p==="google"){
    const q=encodeURIComponent(`name='${FILE}'`);
    const l=await(await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`,{headers:H})).json();
    const f=l.files&&l.files[0];if(!f){delete a.fid;setTk(a);return null}
    a.fid=f.id;setTk(a);
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,{headers:H});if(!r.ok)throw r;return await r.json()}
  if(a.p==="dropbox"){
    const r=await fetch("https://content.dropboxapi.com/2/files/download",{method:"POST",headers:{...H,"Dropbox-API-Arg":JSON.stringify({path:"/"+FILE})}});
    if(r.status===409)return null;if(!r.ok)throw r;return await r.json()}
  const r=await fetch(`https://graph.microsoft.com/v1.0/me/drive/special/approot:/${FILE}:/content`,{headers:H});
  if(r.status===404)return null;if(!r.ok)throw r;return await r.json()}
async function remoteWrite(json){
  const t=await token(),a=tk(),H={Authorization:"Bearer "+t};
  if(a.p==="google"){
    const meta={name:FILE};if(!a.fid)meta.parents=["appDataFolder"];
    const bd="b"+uid().replace(/-/g,"");
    const body=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${bd}--`;
    const url=a.fid?`https://www.googleapis.com/upload/drive/v3/files/${a.fid}?uploadType=multipart&fields=id`:"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id";
    const r=await fetch(url,{method:a.fid?"PATCH":"POST",headers:{...H,"Content-Type":"multipart/related; boundary="+bd},body});
    if(r.status===404&&a.fid){delete a.fid;setTk(a);return remoteWrite(json)}
    if(!r.ok)throw r;a.fid=(await r.json()).id;setTk(a);return}
  if(a.p==="dropbox"){
    const r=await fetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",headers:{...H,"Dropbox-API-Arg":JSON.stringify({path:"/"+FILE,mode:"overwrite",mute:true}),"Content-Type":"application/octet-stream"},body:json});
    if(!r.ok)throw r;return}
  const r=await fetch(`https://graph.microsoft.com/v1.0/me/drive/special/approot:/${FILE}:/content`,{method:"PUT",headers:{...H,"Content-Type":"application/json"},body:json});
  if(!r.ok)throw r}
const failState=e=>(e&&(e.error==="sessao_expirada"||e.error==="sem_login"||e.error==="interaction_required"||e.type==="popup_failed_to_open"||e.type==="popup_closed"))?"auth":"erro";
async function pull(){
  if(!tk())return;cloud.state="sync";paintSync();
  try{const data=await remoteRead();
    if(data&&Array.isArray(data.tasks)&&data.updatedAt>S.updatedAt)adopt(data);
    else if(!data||data.updatedAt<S.updatedAt)await remoteWrite(JSON.stringify(slim()));
    cloud.state="ok"}catch(e){cloud.state=failState(e)}
  paintSync()}
async function push(){
  if(!tk())return;cloud.state="sync";paintSync();
  try{await remoteWrite(JSON.stringify(slim()));cloud.state="ok"}catch(e){cloud.state=failState(e)}
  paintSync()}
async function afterLogin(){
  const a=tk();a.email=await whoami(a);setTk(a);
  toast(`Conectado a ${PROV[a.p]}${a.email?" · "+a.email:""}`);
  await pull();if($("#syncState"))openSettings();render()}
async function connect(p){
  if(!cfgOf(p)){toast("Este provedor ainda não foi configurado (Client ID).");return}
  try{if(p==="google"){await googleToken(false);await afterLogin()}else await startPkce(p)}
  catch(e){toast("Login cancelado ou bloqueado pelo navegador.")}}
function disconnect(){setTk(null);cloud.state="local";toast("Desconectado. Os dados continuam neste aparelho.")}
function paintSync(){const el=$("#syncState");if(el)el.textContent=syncLabel()}
const syncLabel=()=>{const a=tk();if(!a)return"Somente neste aparelho";
  return({ok:"Sincronizado",sync:"Sincronizando…",erro:"Falha ao sincronizar. Tentamos de novo na próxima alteração.",auth:"Sessão expirada. Toque em Sincronizar agora para entrar de novo.",local:"Conectado"}[cloud.state]||"")};
setInterval(()=>{if(tk()&&!document.hidden)pull()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tk())pull()});

/* ---------- prioridade automática ---------- */
const HI=/(urgent|urgência|importante|prazo|crítico|critico|imediat|hoje mesmo|prioridade|vence)/iu;
const LO=/(quando puder|sem pressa|talvez|algum dia|um dia)/iu;
function prio(t){
  if(t.prio&&t.prio!=="auto")return t.prio;
  const txt=t.title+" "+(t.notes||"");
  if(LO.test(txt))return"lo";
  if(HI.test(txt))return"hi";
  if(t.due){const h=(new Date(t.due)-Date.now())/36e5;if(h<24)return"hi";if(h<72)return"mid";return"lo"}
  return"lo"}
const PN={hi:"Alta",mid:"Média",lo:"Baixa"};

/* ---------- interpretador de texto ---------- */
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const noAcc=x=>x.toLowerCase().normalize("NFD").replace(/\p{M}/gu,"");
function parseQuick(raw){
  let s=" "+raw+" ",out={title:"",due:null,rep:{unit:"none",every:1,days:[]},prio:"auto",tags:[]};
  const cut=re=>{const m=s.match(re);if(m)s=s.replace(re," ");return m};
  const L="(?<![\\p{L}])",E="(?![\\p{L}])";
  const wdIdx=w=>DIAS.findIndex(d=>noAcc(w).startsWith(noAcc(d)));
  const WD="(segunda|terça|terca|quarta|quinta|sexta|sábado|sabado|domingo)(?:-feira)?";
  const WDL="(?:segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo)(?:-feira)?s?";
  let m,tm;
  while(tm=s.match(/(?<![\p{L}\d])#([\p{L}][\p{L}\d_-]*)/u)){out.tags.push(tm[1]);s=s.replace(tm[0]," ")}
  let days=null,mday=null;
  if(cut(new RegExp(L+"(?:(?:todo|todos os) )?(?:de )?(?:dias? [úu]t(?:eis|il)|segunda a sexta)"+E,"iu")))days=[1,2,3,4,5];
  else if(cut(new RegExp(L+"(?:fins?|finais) de semana"+E,"iu")))days=[0,6];
  else if(m=cut(new RegExp(L+"(?:toda[s]? (?:as? )?)?("+WDL+"(?:\\s*(?:,|e)\\s*"+WDL+")+)"+E,"iu")))days=[...new Set([...m[1].matchAll(new RegExp(WDL,"giu"))].map(x=>wdIdx(x[0])))].sort();
  if(days){out.rep={unit:"week",every:1,days};out._days=days}
  else if(m=cut(new RegExp(L+"todo dia (\\d{1,2})(?![\\d:hH])","iu"))){out.rep={unit:"month",every:1,days:[]};mday=+m[1]}
  else if(cut(new RegExp(L+"(todos os dias|todo dia|diariamente)"+E,"iu")))out.rep={unit:"day",every:1,days:[]};
  else if(m=cut(new RegExp(L+"toda[s]? (?:a )?"+WD+E,"iu"))){const di=wdIdx(m[1]);out.rep={unit:"week",every:1,days:[di]};out._days=[di]}
  else if(cut(new RegExp(L+"(toda semana|semanalmente)"+E,"iu")))out.rep={unit:"week",every:1,days:[]};
  else if(cut(new RegExp(L+"(todo mês|todo mes|mensalmente)"+E,"iu")))out.rep={unit:"month",every:1,days:[]};
  if(cut(new RegExp(L+"(urgente|urgência|importante|prioridade alta)"+E,"iu")))out.prio="hi";
  else if(cut(new RegExp(L+"(sem pressa|quando puder)"+E,"iu")))out.prio="lo";
  const now=new Date(),base=new Date(now);base.setHours(0,0,0,0);
  let day=null,rel=null,auto=false;
  if(m=cut(new RegExp(L+"(?:daqui a|daqui|em) (\\d{1,3}) ?(minutos?|min|horas?|h|dias?|semanas?)"+E,"iu"))){
    const n=+m[1],u=m[2].toLowerCase(),d=new Date(now);
    if(u.startsWith("min"))d.setMinutes(d.getMinutes()+n);else if(u.startsWith("h"))d.setHours(d.getHours()+n);else if(u.startsWith("d"))d.setDate(d.getDate()+n);else d.setDate(d.getDate()+7*n);
    rel=d}
  if(rel)out.due=toLocalInput(rel);
  else{
    if(cut(new RegExp(L+"depois de amanh[ãa]"+E,"iu")))day=new Date(base.getTime()+2*864e5);
    else if(cut(new RegExp(L+"amanh[ãa]"+E,"iu")))day=new Date(base.getTime()+864e5);
    else if(cut(new RegExp(L+"hoje"+E,"iu")))day=new Date(base);
    else if(cut(new RegExp(L+"(semana que vem|pr[óo]xima semana)"+E,"iu")))day=new Date(base.getTime()+7*864e5);
    else if(m=cut(new RegExp(L+"dia (\\d{1,2}) de (janeiro|fevereiro|mar[çc]o|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)"+E,"iu"))){
      const mi=MESES.findIndex(x=>noAcc(x)===noAcc(m[2]));const d=new Date(base.getFullYear(),mi,+m[1]);if(d<base)d.setFullYear(d.getFullYear()+1);day=d}
    else if(m=cut(new RegExp(L+"dia (\\d{1,2})(?![\\d:])"+E,"iu"))){const d=new Date(base);d.setDate(+m[1]);if(d<base)d.setMonth(d.getMonth()+1);day=d}
    else if(mday!=null){const d=new Date(base);d.setDate(mday);if(d<base)d.setMonth(d.getMonth()+1);day=d}
    else if(m=cut(new RegExp(L+"(?:na |no |em |pr[óo]xim[ao] )?"+WD+E,"iu"))){
      const di=wdIdx(m[1]);let add=(di-base.getDay()+7)%7;if(add===0)add=7;day=new Date(base.getTime()+add*864e5)}

function nextDue(due,r){
  const d=new Date(due),step=()=>{
    if(r.unit==="day")d.setDate(d.getDate()+r.every);

      if(r.days&&r.days.length){let n=0;do{d.setDate(d.getDate()+1);n++}while(!r.days.includes(d.getDay())&&n<8);
}
      else d.setDate(d.getDate()+7*r.every)}
    else if(r.unit==="month")d.setMonth(d.getMonth()+r.every);
    else if(r.unit==="year")d.setFullYear(d.getFullYear()+r.every)};
  let n=0;do{step();n++}while(d<Date.now()&&n<400);
  return toLocalInput(d)}

  const one={day:"Todo dia",week:"Toda semana",month:"Todo mês",year:"Todo ano"}[r.unit],pl={day:"dias",week:"semanas",month:"meses",year:"anos"}[r.unit];

    if(r.every===1&&k==="12345")return"Dias úteis";if(r.every===1&&k==="06")return"Fins de semana";

        (t.rem||[]).forEach(o=>{const at=due-o*6e4;if(at>now)list.push({id:nid(t.id,"r"+o),title:t.title,body:o===0?"É agora.":`Faltam ${offLabel(o).replace(" antes","")}.`,at:new Date(quietEnd(at)),extra:{task:t.id}})});

/* ---------- motor de lembretes ---------- */
function tick(){
  const now=Date.now();let dirty=false;
  if(inQuiet(now))return;if(!S.examples)checkSummaries(now);
  S.tasks.forEach(t=>{
    if(t.done||t.example)return;
    if(t.due){
      const due=new Date(t.due).getTime();
      (t.rem||[]).forEach(o=>{if(!t.fired.includes(o)&&now>=due-o*6e4){t.fired.push(o);dirty=true;
        if(now-(due-o*6e4)<12*36e5)fire(t,o===0?"É agora.":`Faltam ${offLabel(o).replace(" antes","")}.`)}});
      if(t.nag&&due<now&&(t.rem||[]).every(o=>t.fired.includes(o))&&now-(t.lastNag||due)>S.settings.nagMin*6e4&&!(t.snooze&&now<t.snooze)){
        t.lastNag=now;dirty=true;fire(t,"Ainda está pendente. Conclua ou adie.")}
    }
    if(t.snooze&&now>=t.snooze){t.snooze=0;dirty=true;fire(t,"Lembrete adiado.")}
  });
  if(dirty)save();
}

let rec=null;
async function dictate(cb,btn){
  const SRp=plug("SpeechRecognition");
  if(SRp){try{
    const av=await SRp.available();if(!av.available){toast("Reconhecimento de voz indisponível neste aparelho.");return}
    const pm=await SRp.requestPermissions();if(pm.speechRecognition&&pm.speechRecognition!=="granted"){toast("Permita o microfone nas configurações do app.");return}
    const r=await SRp.start({language:"pt-BR",maxResults:1,prompt:"Fale agora",partialResults:false,popup:true});
    if(r&&r.matches&&r.matches[0])cb(r.matches[0]);return}catch(e){toast("Não entendi. Tente de novo.");return}}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Ditado indisponível aqui. Use o microfone do teclado do celular.");return}
  if(rec){try{rec.stop()}catch(e){}return}
  try{rec=new SR();rec.lang="pt-BR";rec.interimResults=false;
    rec.onresult=ev=>cb(ev.results[0][0].transcript);
    rec.onerror=ev=>{toast(ev.error==="not-allowed"||ev.error==="service-not-allowed"?"Microfone bloqueado neste ambiente. Use o microfone do teclado do celular.":"Não entendi. Tente de novo.")};
    rec.onend=()=>{rec=null;btn&&btn.classList.remove("rec")};
    btn&&btn.classList.add("rec");rec.start()}catch(e){rec=null;toast("Não foi possível iniciar o microfone.")}}

let focusTimer=null,wl=null;
function loadFocus(){try{return JSON.parse(localStorage.getItem(KEY+":focus"))}catch(e){return null}}
function saveFocus(f){try{f?localStorage.setItem(KEY+":focus",JSON.stringify(f)):localStorage.removeItem(KEY+":focus")}catch(e){}}
let F=loadFocus();
function startFocus(t){F={id:t.id,start:Date.now(),exits:0};saveFocus(F);
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wl=l).catch(()=>{})}catch(e){}
  renderLock()}
function endFocus(){F=null;saveFocus(null);clearInterval(focusTimer);focusTimer=null;
  try{wl&&wl.release();wl=null}catch(e){}try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}
  $("#lockhost")?.remove()}
const fmtT=ms=>{const s=Math.floor(ms/1e3);return`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`};
function renderLock(){
  const old=$("#lockhost");
  if(!F){old&&old.remove();return}
  const t=S.tasks.find(x=>x.id===F.id);if(!t||t.done){endFocus();return}
  if(old)return;
  const h=document.createElement("div");h.id="lockhost";
  h.innerHTML=`<div class="lock" role="dialog" aria-modal="true" aria-label="Modo foco"><span class="pill" style="align-self:center">Modo foco</span>
   <h2>${esc(t.title)}</h2><div class="bigtime" id="ft" aria-live="off">00:00:00</div>
   <p id="fx" style="color:var(--muted);margin:0"></p>
   <button class="btn pri" id="fdone" style="height:56px;font-size:1.05rem">Concluir tarefa</button>
   <button class="btn danger hold" id="fquit"><i></i><span>Segure 5 s para desistir</span></button></div>`;
  document.body.appendChild(h);
  const tick2=()=>{$("#ft").textContent=fmtT(Date.now()-F.start);$("#fx").textContent=F.exits?`Você saiu do app ${F.exits} vez(es) nesta sessão.`:"Celular em foco. Termine para liberar."};
  tick2();clearInterval(focusTimer);focusTimer=setInterval(tick2,1000);
  $("#fdone").onclick=()=>{const dur=Date.now()-F.start;S.focusDone++;S.xp+=15;const t2=S.tasks.find(x=>x.id===F.id);endFocus();toast(`Foco concluído em ${fmtT(dur)} · +15 XP`);complete(t2)};
  let hold=null,st=0;const bar=$("#fquit i");
  const down=e=>{e.preventDefault();st=Date.now();hold=setInterval(()=>{const p=Math.min(1,(Date.now()-st)/5000);bar.style.width=p*100+"%";if(p>=1){clearInterval(hold);endFocus();render();toast("Sessão de foco encerrada")}},50)};
  const up=()=>{clearInterval(hold);bar.style.width="0"};
  const q=$("#fquit");["pointerdown"].forEach(ev=>q.addEventListener(ev,down));["pointerup","pointerleave","pointercancel"].forEach(ev=>q.addEventListener(ev,up));
  q.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&!hold)down(e)});q.addEventListener("keyup",up)}
document.addEventListener("visibilitychange",()=>{if(F&&document.hidden){F.exits=(F.exits||0)+1;saveFocus(F)}
  if(F&&!document.hidden){try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wl=l).catch(()=>{});document.documentElement.requestFullscreen&&!document.fullscreenElement&&document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}});
window.addEventListener("beforeunload",e=>{if(F){e.preventDefault();e.returnValue=""}});

const semverGt=(a,b)=>{const x=semver(a),y=semver(b);if(!x||!y)return false;for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]>y[i]}return false};
function updDismissed(id){try{const d=JSON.parse(localStorage.getItem(KEY+":upd")||"null");return !!d&&d.id===id&&Date.now()-d.at<864e5}catch(e){return false}}
function updLater(id){try{localStorage.setItem(KEY+":upd",JSON.stringify({id,at:Date.now()}))}catch(e){}}
function showUpdate(id,title,msg,label,action,href){
  if(document.getElementById("upd-"+id))return;
  const el=document.createElement("div");el.className="alert";el.id="upd-"+id;el.setAttribute("role","status");
  el.innerHTML=`<b>${esc(title)}</b><span>${esc(msg)}</span><div class="row">${href?`<a class="btnlink" href="${esc(href)}" target="_blank" rel="noopener" data-a="go">${esc(label)}</a>`:`<button data-a="go">${esc(label)}</button>`}<button data-a="later">Depois</button></div>`;
  el.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;if(a==="later")updLater(id);if(a==="go"&&action)action();el.remove()});
  $("#alerts").appendChild(el)}
async function checkApkUpdate(manual){
  try{const r=await fetch("https://api.github.com/repos/Rafajames/seu-assistente/releases/latest",{headers:{Accept:"application/vnd.github+json"}});if(!r.ok)throw 0;const j=await r.json();
    if(stamped(APP_VERSION)&&semverGt(j.tag_name,APP_VERSION)){const a=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
      if(manual||!updDismissed(j.tag_name))showUpdate(j.tag_name,`Nova versão ${j.tag_name}`,"Baixe e abra o arquivo para atualizar. Seus dados são mantidos.","Baixar atualização",null,a?a.browser_download_url:j.html_url);return true}
    if(manual)toast("Você já está na versão mais recente.")}catch(e){if(manual)toast("Não foi possível verificar agora. Confira a conexão.")}
  return false}
async function checkWebUpdate(manual){
  try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();
    if(stamped(BUILD)&&j.build&&j.build!==BUILD){if(manual||!updDismissed(j.build))showUpdate(j.build,"Nova versão disponível","Atualize para usar as novidades. Suas tarefas são mantidas.","Atualizar agora",applyWebUpdate);return true}
    if(manual)toast("Você já está na versão mais recente.")}catch(e){if(manual)toast("Não foi possível verificar agora.")}
  return false}
async function applyWebUpdate(){try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));const rg=await navigator.serviceWorker.getRegistration();if(rg)await rg.update()}catch(e){}location.reload()}
function checkUpdates(manual){return isNative?checkApkUpdate(manual):checkWebUpdate(manual)}
setTimeout(()=>checkUpdates(false),4000);setInterval(()=>{if(!document.hidden)checkUpdates(false)},30*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)setTimeout(()=>checkUpdates(false),1500)});

/* ---------- tela de entrada: login na nuvem, PIN e biometria ---------- */
const GK=KEY+":gate";
const G=(()=>{try{return JSON.parse(localStorage.getItem(GK))||{}}catch(e){return{}}})();
const gsave=()=>{try{localStorage.setItem(GK,JSON.stringify(G))}catch(e){}};
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
async function hashPin(pin,salt){
  if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);
    return b64(await crypto.subtle.deriveBits({name:"PBKDF2",salt:unb64(salt),iterations:100000,hash:"SHA-256"},k,256))}
  let h=5381;for(const c of salt+pin)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)}
async function bioAvailable(){try{return !isNative&&!!window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()}catch(e){return false}}
async function bioEnroll(){
  const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"Seu Assistente"},
    user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"seu-assistente",displayName:"Seu Assistente"},
    pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
    authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000}});
  G.bio=b64(c.rawId);gsave()}
async function bioCheck(){await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
  allowCredentials:[{type:"public-key",id:unb64(G.bio)}],userVerification:"required",timeout:60000}})}
let gKeyOff=null,lastHide=0;
function gateEl(){let g=$("#gate");
  if(!g){g=document.createElement("div");g.id="gate";g.className="lock";g.setAttribute("role","dialog");g.setAttribute("aria-modal","true");g.setAttribute("aria-label","Entrar no Seu Assistente");document.body.appendChild(g)}
  document.querySelectorAll("body > *:not(#gate):not(script)").forEach(n=>{n.inert=true});return g}
function gateClose(){gKeyOff&&gKeyOff();gKeyOff=null;$("#gate")?.remove();document.querySelectorAll("body > *").forEach(n=>{n.inert=false})}
function gateEnter(){G.entered=true;gsave();gateClose();render()}
function gateWelcome(){
  const g=gateEl();gKeyOff&&gKeyOff();gKeyOff=null;
  const some=Object.keys(PROV).some(p=>!cfgOf(p));
  g.innerHTML=`<div class="logo" aria-hidden="true">✓</div><h2>Seu Assistente</h2>
   <p style="margin:0">Entre para abrir suas tarefas e seu diário.</p>
   <div class="stack">${isNative?"":Object.keys(PROV).map(p=>`<button class="btn pri" data-conn="${p}" ${cfgOf(p)?"":"disabled"}>Entrar com ${PROV[p]}</button>`).join("")}
    ${G.pin?`<button class="btn ${isNative?"pri":"ghost"}" id="g-pin">Entrar com PIN</button>`:`<button class="btn ${isNative?"pri":"ghost"}" id="g-new">Criar um PIN neste aparelho</button>`}</div>
   ${isNative?`<p class="fine">No app Android o login na nuvem ainda não está disponível. Use o PIN.</p>`:some?`<p class="fine">Botões apagados dependem do cadastro do app na nuvem, feito uma vez pelo desenvolvedor.</p>`:""}`;
  g.querySelectorAll("[data-conn]").forEach(b=>b.onclick=async()=>{await connect(b.dataset.conn);if(tk())gateEnter()});
  $("#g-new")&&($("#g-new").onclick=()=>gateSetPin(gateEnter,gateWelcome));
  $("#g-pin")&&($("#g-pin").onclick=()=>gateUnlock(gateEnter,gateWelcome))}
function pinPad({title,hint,len,submit,extra,bind}){
  const g=gateEl();let v="";gKeyOff&&gKeyOff();
  g.innerHTML=`<h2>${esc(title)}</h2><p id="gh" style="margin:0" role="status">${esc(hint||"")}</p><div class="dots" id="gd"></div>
   <div class="pad">${"123456789".split("").map(n=>`<button class="key" data-k="${n}">${n}</button>`).join("")}<button class="key sm" data-k="x" aria-label="Apagar">⌫</button><button class="key" data-k="0">0</button><button class="key sm" data-k="ok" aria-label="Confirmar">OK</button></div>
   <div class="stack">${extra||""}</div>`;
  const paint=()=>{$("#gd").innerHTML=Array.from({length:Math.max(len||6,v.length)},(_,i)=>`<i class="${i<v.length?"on":""}"></i>`).join("")};
  const go=async()=>{if(v.length<4)return;const pin=v;v="";paint();const err=await submit(pin);
    if(err){$("#gh").textContent=err;g.classList.remove("bad");void g.offsetWidth;g.classList.add("bad")}};
  const key=k=>{if(/^\d$/.test(k)){if(v.length<6){v+=k;paint();if(len&&v.length===len)go()}}else if(k==="x"){v=v.slice(0,-1);paint()}else if(k==="ok")go()};
  g.querySelectorAll(".key").forEach(b=>b.onclick=()=>key(b.dataset.k));
  const kd=e=>{if(/^\d$/.test(e.key))key(e.key);else if(e.key==="Backspace")key("x");else if(e.key==="Enter")key("ok")};
  window.addEventListener("keydown",kd);gKeyOff=()=>window.removeEventListener("keydown",kd);
  paint();bind&&bind(g)}
function gateSetPin(done,back){
  pinPad({title:"Crie seu PIN",hint:"De 4 a 6 números que só você saiba.",
    extra:`<button class="btn ghost" id="g-bk">Voltar</button>`,bind:()=>{$("#g-bk").onclick=back},
    submit:async p1=>{pinPad({title:"Repita o PIN",hint:"Digite o mesmo PIN para confirmar.",
      extra:`<button class="btn ghost" id="g-bk">Recomeçar</button>`,bind:()=>{$("#g-bk").onclick=()=>gateSetPin(done,back)},
      submit:async p2=>{if(p2!==p1)return"Os PINs não são iguais. Tente de novo.";
        const salt=newSalt();G.pin={salt,hash:await hashPin(p1,salt),len:p1.length};G.fails=0;G.until=0;gsave();
        if(await bioAvailable()&&!G.bio)gateOfferBio(done);else done()}})}})}
function gateOfferBio(done){
  const g=gateEl();gKeyOff&&gKeyOff();gKeyOff=null;
  g.innerHTML=`<div class="logo" aria-hidden="true">☝</div><h2>Usar digital ou rosto?</h2><p style="margin:0">Entre mais rápido com a biometria do celular. O PIN continua valendo como reserva.</p>
   <div class="stack"><button class="btn pri" id="g-yes">Ativar biometria</button><button class="btn ghost" id="g-no">Agora não</button><p class="fine" id="gh" role="status"></p></div>`;
  $("#g-yes").onclick=async()=>{try{await bioEnroll();done()}catch(e){$("#gh").textContent="Não foi possível ativar. Você pode tentar depois em Ajustes."}};
  $("#g-no").onclick=done}
function gateUnlock(done,back,opts={}){
  pinPad({title:opts.title||"Digite seu PIN",hint:opts.hint||"",len:G.pin.len,
    extra:(G.bio&&!opts.noBio?`<button class="btn pri" id="g-bio">Usar digital ou rosto</button>`:"")+(back?`<button class="btn ghost" id="g-bk">${esc(opts.backLabel||"Voltar")}</button>`:"")+(opts.noForgot?"":`<button class="btn ghost" id="g-fg">Esqueci o PIN</button>`),
    bind:()=>{$("#g-bk")&&($("#g-bk").onclick=back);
      $("#g-bio")&&($("#g-bio").onclick=async()=>{try{await bioCheck();done()}catch(e){$("#gh").textContent="Biometria não reconhecida. Digite o PIN."}});
      $("#g-fg")&&($("#g-fg").onclick=()=>{if(confirm("Para redefinir o PIN, os dados deste aparelho serão apagados. Se você usa a nuvem, entre de novo e eles voltam. Continuar?")){
        try{localStorage.removeItem(KEY);localStorage.removeItem(GK);localStorage.removeItem(KEY+":auth")}catch(e){}location.reload()}})},
    submit:async pin=>{const now=Date.now();if(G.until>now)return`Aguarde ${Math.ceil((G.until-now)/1000)} s para tentar de novo.`;
      if(await hashPin(pin,G.pin.salt)===G.pin.hash){G.fails=0;G.until=0;gsave();done();return}
      G.fails=(G.fails||0)+1;if(G.fails%5===0)G.until=Date.now()+30000*(G.fails/5);gsave();return"PIN incorreto."}})}
function gateInit(){
  if(G.entered||tk()){if(G.pin&&G.every)gateUnlock(gateClose,null)}
  else gateWelcome()}
document.addEventListener("visibilitychange",()=>{if(document.hidden){lastHide=Date.now();return}
  if(G.pin&&G.every&&lastHide&&Date.now()-lastHide>12e4&&!$("#gate")&&!F)gateUnlock(gateClose,null)});
function securityHTML(){
  return`<div class="fld"><span class="l">Segurança e entrada</span>
   <div class="row"><span class="pill ${G.pin?"":"plain"}">${G.pin?"PIN ativo":"Sem PIN"}</span>${G.bio?'<span class="pill">Biometria ativa</span>':""}</div>
   ${G.pin?`<label class="sw"><input type="checkbox" id="g-every" ${G.every?"checked":""}>Pedir PIN ou biometria ao abrir o app</label>
    <div class="row"><button class="btn" id="g-chg">Trocar PIN</button><button class="btn" id="g-rm">Remover PIN</button><button class="btn" id="g-bioset" hidden></button></div>`
    :`<button class="btn" id="g-mk">Criar PIN</button>`}
   <button class="btn danger" id="g-out">Sair e voltar à tela de login</button>
   <p class="hint" style="margin:0">O login aparece só na primeira vez e fica lembrado neste aparelho. PIN e biometria ficam guardados só aqui e protegem o app de quem pegar o celular. ${isNative?"No app Android a biometria ainda não está disponível.":""}</p></div>`}
function bindSecurity(){
  const back=()=>{gateClose();openSettings()};
  $("#g-mk")&&($("#g-mk").onclick=()=>gateSetPin(back,back));
  $("#g-every")&&($("#g-every").onchange=e=>{G.every=e.target.checked;gsave()});
  const verify=then=>gateUnlock(then,back,{title:"Confirme seu PIN",backLabel:"Cancelar",noForgot:true,noBio:true});
  $("#g-chg")&&($("#g-chg").onclick=()=>verify(()=>gateSetPin(back,back)));
  $("#g-rm")&&($("#g-rm").onclick=()=>verify(()=>{delete G.pin;delete G.bio;G.every=false;gsave();back()}));
  const bb=$("#g-bioset");
  if(bb)bioAvailable().then(ok=>{if(!ok)return;bb.hidden=false;bb.textContent=G.bio?"Desativar biometria":"Ativar biometria";
    bb.onclick=async()=>{if(G.bio){delete G.bio;gsave();openSettings();return}try{await bioEnroll();openSettings()}catch(e){toast("Não foi possível ativar a biometria.")}}});
  $("#g-out")&&($("#g-out").onclick=()=>{if(!confirm("Sair? Você volta para a tela de login. Os dados continuam neste aparelho."))return;
    setTk(null);cloud.state="local";G.entered=false;gsave();$("#scrim")?.remove();gateWelcome()})}
const redirecting=(()=>{try{return new URLSearchParams(location.search).has("code")&&!!localStorage.getItem("assistente:pk")}catch(e){return false}})();
if(!redirecting)gateInit();
</script>
