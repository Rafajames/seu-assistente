name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ativar o GitHub Pages (se o token permitir)
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Registrar a versão do site
        run: |
          B="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$B/" www/index.html www/sw.js
          echo "{\"build\":\"$B\"}" > www/version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deployment
        uses: actions/deploy-pages@v4
